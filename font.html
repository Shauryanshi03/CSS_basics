<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: blueviolet;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            text-decoration: underline;
            text-shadow: 4px 5px lightblue;
        }
        h2{
            color: teal;
            font-style: italic;
            letter-spacing: 18px;
            border-top: 5px dotted;
            border-color: blueviolet;
        }
        p{
            color: darkmagenta;
            font-weight: bold;
            text-indent: 30px;
            text-transform: uppercase;
            word-spacing: 20px;
            font-size: 20px;
            text-align: justify;
            line-height: 50px;
        }
        a{
            background-color: magenta;
        }
        a:active{
            background-color: chartreuse;
        }
        a:hover{
            background-color: red;
            border: 5px solid green;
        }
        a:visited{
            background-color: gold;
        }
    </style>
</head>
<body>
    <h1>Hello HTML!</h1>
    <h2>Hello CSS!</h2>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad quas veritatis
         deserunt quam incidunt sit libero possimus odit. Blanditiis dicta 
         qui vel libero facilis cumque eum voluptates atque ab fugit.</p>
         <a href="ele.jpg" target="_blank">Click Me</a>
</body>
</html>
