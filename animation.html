<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes blink{
            0%{
                opacity:0;
            }
            50%{
                opacity:1;
            }
        }

        .blink{
            animation:blink 1s infinite;
            color:brown
        }
    </style>
</head>
<body>
    <p class="blink">Hello Lucknow!</p>
</body>
</html>
