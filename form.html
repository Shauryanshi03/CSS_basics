<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            border: 3px solid black;
            background-image: url("ele.jpg");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: right;
        }
        input{
            padding: 5px;
            margin: 10px;
        }
        label{
            padding: 20px;
        }
        h1{
            border: 3px solid black;
            border-radius: 10px;
        }
        form:hover{
            background-color: aqua;
            border:10px solid plum;
        }
    </style>
</head>
<body>
    <h1>Form design in CSS</h1>
    <form>
    <label for="n1">Name</label>
    <input type="text" id="n1"> <br>
    <label for="n2">Email</label>
    <input type="email" id="n2"> <br>
    <label for="n3">Password</label>
    <input type="password" id="n3"> <br>
    <input type="submit"> <br>
    </form>
</body>
</html>
